[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "https://www.blgroundworks.com/*"
  to = "https://blgroundworks.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.blgroundworks.com/*"
  to = "https://blgroundworks.com/:splat"
  status = 301
  force = true
